# Self-contained stack: nginx (TLS) + Snapshot
# App is only on the Docker network; host publishes 80/443.
#
# Prefer on VMs that already run nginx:
#   ./deploy/container-deploy.sh --host-nginx --domain ...
# (uses host nginx-setup.sh + localhost publish — no port 80/443 clash)
#
#   docker compose -f deploy/docker-compose.nginx.yml up -d --build

services:
  snapshot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PLAYWRIGHT_VERSION: "1.62.1"
    image: ${SNAPSHOT_IMAGE:-snapshot:latest}
    container_name: snapshot
    expose:
      - "8787"
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      SNAPSHOT_DATA_DIR: /data
      SNAPSHOT_WEB_DIST: /app/apps/web/dist
      SNAPSHOT_CORS_ORIGINS: ${SNAPSHOT_CORS_ORIGINS:-*}
      NODE_ENV: production
    volumes:
      - snapshot-data:/data
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    mem_limit: ${SNAPSHOT_MEM_LIMIT:-2g}
    memswap_limit: ${SNAPSHOT_MEM_LIMIT:-2g}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - snapshot_net

  nginx:
    image: nginx:1.27-alpine
    container_name: snapshot-nginx
    depends_on:
      snapshot:
        condition: service_healthy
    ports:
      - "${SNAPSHOT_HTTP_PORT:-80}:80"
      - "${SNAPSHOT_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/docker/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/docker/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "--spider",
          "http://127.0.0.1/nginx-health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - snapshot_net

networks:
  snapshot_net:
    name: snapshot_net
    driver: bridge

volumes:
  snapshot-data:
    name: snapshot-data
